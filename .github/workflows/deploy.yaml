name: Build & Deploy GitOps

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Application Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: irfan29818/terminal-portfolio:${{ github.sha }}

      - name: Checkout K8s Manifest Repo
        uses: actions/checkout@v4
        with:
          repository: 'Irfan-Ahamed-Seyam/k8s-gitops-project'
          token: ${{ secrets.GITOPS_PAT }}
          path: 'manifest-repo'

      - name: Update Manifest and Push
        run: |
          cd manifest-repo
          sed -i 's|image: irfan29818/terminal-portfolio:.*|image: irfan29818/terminal-portfolio:'${{ github.sha }}'|g' webapp.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add webapp.yaml
          git diff --staged --quiet || (git commit -m "chore(ci): update image tag to ${{ github.sha }} [skip ci]" && git push)
