name: Build & Deploy GitOps

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'webapp.yaml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Manifest Repo
        uses: actions/checkout@v4

      - name: Checkout Application Code
        uses: actions/checkout@v4
        with:
          repository: 'Irfan-Ahamed-Seyam/terminal-portfolio'
          token: ${{ secrets.GITOPS_PAT }}
          path: 'app'

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: irfan29818/terminal-portfolio:${{ github.sha }}

      - name: Update Manifest and Push
        run: |
          sed -i 's|image: irfan29818/terminal-portfolio:.*|image: irfan29818/terminal-portfolio:'${{ github.sha }}'|g' webapp.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add webapp.yaml
          git commit -m "chore(ci): update image tag to ${{ github.sha }} [skip ci]"
          git push
